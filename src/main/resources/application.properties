spring.application.name=${APP_NAME:event-mng}

server.servlet.context-path=${SERVER_CONTEXT_PATH:/event-mng}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/event_mng}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION:3600}
application.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:360000}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=true

# File Storage Configuration
app.upload.dir=${UPLOAD_DIR:uploads}
app.file.base-url=${FILE_BASE_URL:http://localhost:8080/event-mng/images}
